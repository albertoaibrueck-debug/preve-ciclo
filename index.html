<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Préve Ciclo</title>
<meta name="theme-color" content="#f472b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Préve Ciclo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fdf2f8}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#1f2937}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;position:relative;padding-bottom:110px}

/* Cabeçalho */
.header{background:#f472b6;padding:calc(env(safe-area-inset-top,0px) + 44px) 20px 40px;border-radius:0 0 40px 40px}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.greeting{color:#fce7f3;font-size:12px;font-weight:700;text-transform:uppercase}
.title{color:#fff;font-size:28px;font-weight:800;margin-top:4px}
.gear{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);font-size:18px;color:#fff}
.sync{display:inline-block;margin-top:6px;color:#fce7f3;font-size:11px;font-weight:600}
.quote{background:rgba(255,255,255,.15);border-radius:16px;padding:16px;border:1px solid rgba(255,255,255,.2)}
.quote-label{color:#fce7f3;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.quote-text{color:#fff;font-size:17px;font-weight:700;margin-top:6px;line-height:24px}

/* Cartões de previsão */
.cards{display:flex;gap:10px;margin-top:-24px;padding:0 20px}
.card{flex:1;min-width:0;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.08)}
.card.period{background:#fff1f2}.card.fertile{background:#faf5ff}.card.weather{background:#fffbeb}
.card .emoji{font-size:24px;margin-bottom:4px}
.card .label{font-size:11px;color:#6b7280;font-weight:700}
.card .value{font-size:20px;font-weight:800;color:#1f2937;margin-top:4px;white-space:nowrap}
.card .unit{font-size:10px;color:#9ca3af;margin-top:2px;line-height:13px}

/* Calendário */
.cal{padding:0 20px;margin-top:24px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.month{font-size:18px;font-weight:800;color:#1f2937;text-transform:capitalize}
.arrow{padding:8px 12px;font-size:24px;color:#4b5563;font-weight:700;line-height:1}
.week{display:flex;margin-bottom:8px}
.week span{flex:1;text-align:center;font-size:12px;font-weight:700;color:#9ca3af}
.grid{display:flex;flex-wrap:wrap}
.cell{width:14.2857%;aspect-ratio:1;padding:2px}
.day{width:100%;height:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;position:relative;border:1.5px solid transparent}
.day .n{font-size:14px;color:#374151;font-weight:600}
.day.today{background:#f3f4f6}.day.today .n{color:#f43f5e}
.day.fertile{background:#faf5ff}
.day.pred{border:1.5px dashed #fda4af;background:#fff7f8}
.day.period{background:#ffe4e6;border-color:transparent}.day.period .n{color:#be123c}
.day.future .n{color:#9ca3af}
.day.today{box-shadow:inset 0 0 0 1.5px #f43f5e}
.dots{display:flex;gap:2px;margin-top:3px;height:5px}
.dot{width:5px;height:5px;border-radius:3px}
.dot.p{background:#f43f5e}.dot.f{background:#a855f7}.dot.o{background:#f9a8d4;border:1px solid #ec4899}.dot.s{background:#fb7185;border-radius:1px;transform:rotate(45deg)}
.day .mood{position:absolute;top:1px;right:2px;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:14px 22px 0;font-size:11px;color:#6b7280;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px}

/* Blocos abaixo do calendário */
.block{margin:18px 20px 0;border-radius:20px;padding:16px;box-shadow:0 4px 8px rgba(0,0,0,.06)}
.block h3{margin:0 0 8px;font-size:14px;font-weight:800;color:#374151}
.block.stats{background:#fff1f2}
.block.tips{background:#f3e8ff}
.block.tips li,.block.tips p{color:#7e22ce;font-weight:600;font-size:13px;line-height:19px}
.block ul{margin:0;padding-left:18px}
.stat-row{display:flex;gap:10px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}
.stat small{font-size:10px;color:#9ca3af;font-weight:600}
.note{font-size:11px;color:#6b7280;margin:10px 0 0;line-height:16px}
.banner{margin:18px 20px 0;background:#fffbeb;border-radius:16px;padding:12px 14px;font-size:12px;color:#92400e;font-weight:600;line-height:17px}
.day .bell{position:absolute;top:1px;left:2px;font-size:9px}
.block.water{background:#eff6ff}
.block.water h3{display:flex;justify-content:space-between;align-items:center}
.linkb{font-size:12px;font-weight:700;color:#2563eb}
.wrow{background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px}
.wtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.wtop b{font-weight:800;color:#1f2937}
.wtop .you{font-size:10px;font-weight:700;color:#2563eb;background:#dbeafe;border-radius:99px;padding:1px 7px;margin-left:4px}
.wnum{font-size:12px;color:#6b7280;font-weight:600;white-space:nowrap}
.bar{height:8px;background:#e5e7eb;border-radius:99px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:#60a5fa;border-radius:99px;transition:width .2s}
.bar i.full{background:#22c55e}
.wbtns{display:flex;gap:8px;margin-top:9px}
.wb{flex:1;padding:9px 0;border-radius:12px;border:1px solid #bfdbfe;color:#1d4ed8;font-weight:700;font-size:14px;background:#fff}
.wb.plus{background:#3b82f6;border-color:#3b82f6;color:#fff}
.wb:disabled{opacity:.4}
.sheet .wrow{background:#eff6ff}
.wdone{font-size:11px;color:#16a34a;font-weight:700;margin-top:5px}
.block.rem{background:#fefce8}
.rem-item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:8px 0;border-top:1px solid #fef08a;font-size:13px}
.rem-item:first-of-type{border-top:0}
.rem-item .when{font-size:11px;font-weight:800;color:#a16207;min-width:74px}
.rem-item.past{opacity:.45}
.lrow{display:flex;gap:8px;margin-top:8px;align-items:center}
.lrow input[type=time]{width:104px;flex:none;border:1px solid #e5e7eb;border-radius:12px;padding:9px 6px;font:inherit;font-size:14px;color:#374151;background:#fff}
.lrow input[type=text]{flex:1;min-width:0}
.lx{flex:none;width:36px;height:40px;border-radius:12px;border:1px solid #e5e7eb;color:#9ca3af;font-size:16px}
.addl{margin-top:10px;width:100%;padding:11px 0;border-radius:12px;border:1.5px dashed #f9a8d4;color:#db2777;font-weight:700;font-size:13px}
.stepper{display:flex;align-items:center;gap:12px;margin-top:10px}
.stepper .wb{flex:none;width:64px}
.stepper b{flex:1;text-align:center;font-size:22px;font-weight:800}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.foot{font-size:10px;color:#9ca3af;text-align:center;margin:22px 30px 0;line-height:15px}

/* Botão flutuante */
.fab{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;background:#f43f5e;color:#fff;font-size:28px;font-weight:300;box-shadow:0 6px 10px rgba(244,63,94,.4);z-index:5}

/* Folha (modal) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:32px 32px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;width:100%;max-width:480px;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.handle{width:48px;height:5px;background:#d1d5db;border-radius:3px;margin:0 auto 16px}
.s-title{font-size:20px;font-weight:800;color:#1f2937}
.s-sub{font-size:14px;color:#6b7280;margin-bottom:20px}
.sec{font-size:14px;font-weight:700;color:#374151;margin:16px 0 8px}
.row{display:flex;gap:10px}.row.tight{gap:8px}
.toggle{flex:1;padding:12px 0;border-radius:12px;border:2px solid #e5e7eb;font-weight:600;color:#4b5563}
.toggle.on{border-color:#f43f5e;background:#fff1f2;color:#f43f5e}
.opt{flex:1;padding:10px 0;border-radius:12px;border:1px solid #e5e7eb;font-size:13px;font-weight:500;color:#4b5563}
.opt.on{border-color:#f43f5e;background:#fff1f2;color:#f43f5e;font-weight:700}
.moodb{flex:1;padding:8px 0 6px;border-radius:12px;border:1px solid #e5e7eb;font-size:24px;line-height:1.1}
.moodb small{display:block;font-size:9px;color:#6b7280;font-weight:600;margin-top:3px}
.moodb.on{border-color:#facc15;background:#fefce8}
.tip{font-size:12px;color:#7e22ce;font-weight:600;margin-top:8px;background:#f3e8ff;padding:10px 12px;border-radius:10px;line-height:18px}
.tip ul{margin:4px 0 0;padding-left:16px}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;color:#374151;background:#fff}
textarea{resize:none;height:64px}
.save{margin-top:24px;width:100%;background:#f43f5e;padding:16px 0;border-radius:16px;color:#fff;font-weight:700;font-size:16px}
.ghost{margin-top:10px;width:100%;padding:12px 0;border-radius:16px;color:#9ca3af;font-weight:600;font-size:13px}
.btn2{margin-top:10px;width:100%;padding:12px 0;border-radius:14px;border:2px solid #f43f5e;color:#f43f5e;font-weight:700;font-size:14px}
.btn2:disabled{border-color:#e5e7eb;color:#9ca3af}
.help{font-size:12px;color:#6b7280;line-height:18px;margin:6px 0 0}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#f3f4f6;color:#4b5563}
.pill.ok{background:#dcfce7;color:#166534}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f2937;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:99px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="greeting" id="greeting"></div>
        <div class="title">Préve Ciclo</div>
        <div class="sync" id="sync"></div>
      </div>
      <button class="gear" id="gear" aria-label="Configurações">⚙︎</button>
    </div>
    <div class="quote">
      <div class="quote-label" id="quoteLabel"></div>
      <div class="quote-text" id="quoteText"></div>
    </div>
  </div>

  <div class="cards">
    <div class="card period"><div class="emoji">🩸</div><div class="label" id="c1l">Próxima</div><div class="value" id="c1v">--</div><div class="unit" id="c1u"></div></div>
    <div class="card fertile"><div class="emoji">🌸</div><div class="label">Fertilidade</div><div class="value" id="c2v">--</div><div class="unit" id="c2u"></div></div>
    <div class="card weather"><div class="emoji" id="c3e">☀️</div><div class="label">Hoje</div><div class="value" id="c3v">--</div><div class="unit" id="c3u">carregando...</div></div>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="block water" id="water"></div>
  <div class="block rem" id="rem" hidden></div>

  <div class="cal">
    <div class="cal-head">
      <button class="arrow" id="prev" aria-label="Mês anterior">‹</button>
      <div class="month" id="month"></div>
      <button class="arrow" id="next" aria-label="Próximo mês">›</button>
    </div>
    <div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="legend">
    <span><i style="background:#ffe4e6"></i>Menstruação</span>
    <span><i style="border:1.5px dashed #fda4af"></i>Prevista</span>
    <span><i style="background:#f3e8ff"></i>Fértil</span>
    <span><i style="background:#f9a8d4;border-radius:5px"></i>Ovulação</span>
  </div>

  <div class="block tips" id="tips" hidden></div>
  <div class="block stats" id="stats"></div>
  <p class="foot">As previsões são estimativas e melhoram a cada ciclo registrado. O período fértil previsto não serve como método contraceptivo, e o app não substitui orientação médica.</p>

  <button class="fab" id="fab" aria-label="Registrar hoje">+</button>
</div>

<div class="overlay" id="dayOv"><div class="sheet" id="daySheet"></div></div>
<div class="overlay" id="cfgOv"><div class="sheet" id="cfgSheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Préve Ciclo — lógica do ciclo (usada pela página e pelo service worker) */
(function (root) {
  'use strict';
  var DAY = 86400000;

  // Dias são tratados como números inteiros (dias desde 1970) para evitar problemas de fuso.
  function num(k) { var p = k.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY); }
  function key(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
  function today(now) {
    now = now || new Date();
    return Math.round(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / DAY);
  }
  function avg(a) { return a.reduce(function (s, x) { return s + x; }, 0) / a.length; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  /* Analisa os registros e devolve médias + previsões.
     As médias se ajustam sozinhas a cada nova menstruação registrada. */
  function analyze(entries, t) {
    entries = entries || {};
    if (t == null) t = today();
    var days = Object.keys(entries)
      .filter(function (k) { return entries[k] && entries[k].period; })
      .map(num).filter(function (d) { return d <= t; })
      .sort(function (a, b) { return a - b; });

    // Agrupa dias seguidos (tolerando 1 dia sem registro) em menstruações
    var periods = [];
    days.forEach(function (d) {
      var p = periods[periods.length - 1];
      if (p && d - p.end <= 2) p.end = d; else periods.push({ start: d, end: d });
    });

    var last = periods[periods.length - 1] || null;
    var ongoing = !!last && t - last.end <= 1;

    // Duração média: só menstruações já encerradas, as 6 mais recentes
    var done = periods.filter(function (p, i) { return !(ongoing && i === periods.length - 1); });
    var durs = done.slice(-6).map(function (p) { return p.end - p.start + 1; });
    var periodLen = durs.length ? clamp(Math.round(avg(durs)), 2, 10) : 5;
    if (ongoing) periodLen = Math.max(periodLen, last.end - last.start + 1);

    // Tamanho do ciclo: intervalo entre inícios; descarta intervalos improváveis
    // (menos de 15 ou mais de 60 dias costumam ser falha de registro).
    var gaps = [];
    for (var i = 1; i < periods.length; i++) gaps.push(periods[i].start - periods[i - 1].start);
    var valid = gaps.filter(function (g) { return g >= 15 && g <= 60; }).slice(-6);
    var cycleLen = 28, spread = null;
    if (valid.length) {
      // média ponderada: ciclos mais recentes pesam mais
      var sw = 0, sx = 0;
      valid.forEach(function (g, j) { sw += j + 1; sx += g * (j + 1); });
      cycleLen = Math.round(sx / sw);
      if (valid.length >= 2) {
        var m = avg(valid);
        spread = Math.round(Math.sqrt(avg(valid.map(function (g) { return (g - m) * (g - m); }))));
      }
    }

    var res = {
      periods: periods, last: last, ongoing: ongoing,
      periodLen: periodLen, durationsUsed: durs.length,
      cycleLen: cycleLen, cyclesUsed: valid.length, spread: spread,
      cycleDay: last ? t - last.start + 1 : null,
      next: null, rawNext: null, late: 0, predicted: [], windows: []
    };
    if (!last) return res;

    var raw = last.start + cycleLen;
    res.rawNext = raw;
    res.late = (!ongoing && t > raw) ? t - raw : 0;
    var base = res.late ? t : raw;          // se atrasou, pode vir a qualquer momento
    res.next = base;
    for (var c = 0; c < 6; c++) {
      var s = base + c * cycleLen;
      res.predicted.push({ start: s, end: s + periodLen - 1 });
      var ov = (c === 0 ? raw : s) - 14;    // ovulação ~14 dias antes da menstruação
      res.windows.push({ start: ov - 5, end: ov + 1, ov: ov });
    }
    return res;
  }

  function inPredicted(a, d) {
    return a.predicted.some(function (p) { return d >= p.start && d <= p.end; });
  }
  function windowOf(a, d) {
    for (var i = 0; i < a.windows.length; i++) {
      if (d >= a.windows[i].start && d <= a.windows[i].end) return a.windows[i];
    }
    return null;
  }

  // Fase do dia: 'menstruacao' | 'tpm' | 'fertil' | 'normal'
  function phase(a, entries, t) {
    var e = entries && entries[key(t)];
    if ((e && e.period) || a.ongoing) return 'menstruacao';
    if (!a.last) return 'normal';
    if (a.late > 0) return 'tpm';
    var d = a.next - t;
    if (d === 0) return 'menstruacao';
    if (d >= 1 && d <= 5) return 'tpm';
    if (windowOf(a, t)) return 'fertil';
    return 'normal';
  }

  function fertileInfo(a, t) {
    for (var i = 0; i < a.windows.length; i++) {
      var w = a.windows[i];
      if (w.end < t) continue;
      if (w.start <= t) return { now: true, isOv: w.ov === t, left: w.end - t };
      return { now: false, days: w.start - t };
    }
    return null;
  }

  function cycleMessage(entries, t) {
    if (t == null) t = today();
    var a = analyze(entries, t);
    if (!a.last) {
      return { title: 'Préve Ciclo 💕', body: 'Registre a última menstruação para começar as previsões.' };
    }
    var p, d = a.next - t;
    if (a.ongoing) p = '🩸 Dia ' + a.cycleDay + ' da menstruação · próxima em ' + plural(d, 'dia', 'dias');
    else if (a.late > 0) p = '🩸 Menstruação atrasada ' + plural(a.late, 'dia', 'dias') + ' — pode vir a qualquer momento';
    else if (d === 0) p = '🩸 Menstruação prevista para hoje';
    else p = '🩸 ' + (d === 1 ? 'Falta 1 dia' : 'Faltam ' + d + ' dias') + ' para a menstruação';

    var f = fertileInfo(a, t), q = '';
    if (f) {
      if (f.now) q = f.isOv ? '🌸 Ovulação prevista para hoje' : '🌸 Período fértil agora (mais ' + plural(f.left, 'dia', 'dias') + ')';
      else q = '🌸 ' + (f.days === 1 ? 'Falta 1 dia' : 'Faltam ' + f.days + ' dias') + ' para o período fértil';
    }
    return { title: 'Préve Ciclo 💕', body: p + (q ? '\n' + q : '') };
  }

  function fetchWeather(lat, lon) {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1';
    return fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.daily) return null;
      return {
        max: Math.round(d.daily.temperature_2m_max[0]),
        min: Math.round(d.daily.temperature_2m_min[0]),
        rain: d.daily.precipitation_probability_max[0]
      };
    });
  }

  function weatherMessage(w, city) {
    if (!w) return null;
    var icon = w.rain >= 60 ? '🌧️' : w.rain >= 30 ? '⛅' : '☀️';
    return {
      title: icon + ' ' + (city || 'Hoje') + ' hoje',
      body: 'Máx ' + w.max + '° · Mín ' + w.min + '° · ' + (w.rain == null ? '--' : w.rain) + '% de chance de chuva'
    };
  }

  root.Ciclo = {
    num: num, key: key, today: today, plural: plural,
    analyze: analyze, phase: phase, fertileInfo: fertileInfo,
    inPredicted: inPredicted, windowOf: windowOf,
    cycleMessage: cycleMessage, fetchWeather: fetchWeather, weatherMessage: weatherMessage
  };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>

function renderCal(a, t) {

    var isP = !!(e && e.period), w = a.last ? C.windowOf(a, dn) : null, pred = a.last && !isP && dn >= t && C.inPredicted(a, dn);
    var fert = w && !isP && dn > (a.last ? a.last.end : 0);

    if (dn > t) day.classList.add('future');

function waterRows(box, d, onChange) {

    var v = waterVal(d, p), goal = people[p].goal, row = el('div', 'wrow');

  for (var d = t; d <= t + 7; d++) {
    var k = C.key(d);
    remindersOf(entries[k]).slice().sort(function (a, b) { return (a.t || '99') < (b.t || '99') ? -1 : 1; })
      .forEach(function (r) { itens.push({ d: d, k: k, r: r }); });
  }
  if (!itens.length) { box.hidden = true; return; }
  box.hidden = false; box.textContent = '';
  box.appendChild(el('h3', null, '📌 Próximos lembretes'));
  itens.slice(0, 6).forEach(function (it) {
    var dia = it.d === t ? 'Hoje' : it.d === t + 1 ? 'Amanhã'
      : new Date(it.d * 86400000).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', timeZone: 'UTC' });
    var b = el('button', 'rem-item' + (it.d === t && it.r.t && it.r.t < hm ? ' past' : ''));
    b.appendChild(el('span', 'when', dia + (it.r.t ? ' ' + it.r.t : '')));
    b.appendChild(el('span', null, it.r.txt));
    b.onclick = function () { openDay(it.k); };
    box.appendChild(b);
  });
  if (itens.length > 6) box.appendChild(el('p', 'note', '+ ' + (itens.length - 6) + ' no calendário'));
}

/* ---------- registro do dia ---------- */
var draft, draftKey, draftFuture;
function openDay(k) {
  draftKey = k; draftFuture = C.num(k) > C.today();
  var s = entries[k] || {};
  draft = {
    period: !!s.period, flow: s.flow || null, cramps: s.cramps || null, mood: s.mood || null, sex: !!s.sex,
    reminders: remindersOf(s).map(function (r) { return { t: r.t || '', txt: r.txt || '' }; })
  };
  $('daySheet').scrollTop = 0;
  drawDay(); $('dayOv').classList.add('open');
}
function drawReminders(sh) {
  sh.appendChild(el('div', 'sec', 'Lembretes 🔔'));
  sh.appendChild(el('p', 'help', 'Com horário, chega notificação nos dois celulares na hora marcada. Sem horário, fica só anotado.'));
  draft.reminders.forEach(function (r, i) {
    var row = el('div', 'lrow');
    var ti = el('input'); ti.type = 'time'; ti.value = r.t; ti.setAttribute('aria-label', 'Horário');
    ti.onchange = ti.oninput = function () { r.t = ti.value; };
    var tx = el('input'); tx.type = 'text'; tx.value = r.txt; tx.placeholder = 'Ex.: tomar remédio'; tx.maxLength = 120;
    tx.oninput = function () { r.txt = tx.value; };
    var x = el('button', 'lx', '✕'); x.setAttribute('aria-label', 'Remover lembrete');
    x.onclick = function () { draft.reminders.splice(i, 1); drawDay(); };
    row.appendChild(ti); row.appendChild(tx); row.appendChild(x); sh.appendChild(row);
  });
  if (draft.reminders.length < 10) {
    var add = el('button', 'addl', '+ Adicionar lembrete');
    add.onclick = function () {
      draft.reminders.push({ t: '', txt: '' }); drawDay();
      var ins = $('daySheet').querySelectorAll('.lrow input[type=text]'); if (ins.length) ins[ins.length - 1].focus();
    };
    sh.appendChild(add);
  }
}
function drawDay() {
  var sh = $('daySheet'), keep = sh.scrollTop; sh.textContent = '';
  var p = draftKey.split('-'), date = new Date(+p[0], +p[1] - 1, +p[2]);
  sh.appendChild(el('div', 'handle'));
  var titulo = date.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  sh.appendChild(el('div', 's-title', titulo.charAt(0).toUpperCase() + titulo.slice(1)));
  sh.appendChild(el('div', 's-sub', draftFuture ? 'Dia futuro: aqui dá para agendar lembretes 🔔' : 'Conte como foi o dia dela 💗'));

  function simNao(titulo, campo) {
    sh.appendChild(el('div', 'sec', titulo));
    var r = el('div', 'row');
    [['Sim', true], ['Não', false]].forEach(function (o) {
      var b = el('button', 'toggle' + (draft[campo] === o[1] ? ' on' : ''), o[0]);
      b.onclick = function () { draft[campo] = o[1]; if (campo === 'period' && !o[1]) draft.flow = null; drawDay(); };
      r.appendChild(b);
    });
    sh.appendChild(r);
  }
  function opcoes(titulo, campo, lista) {
    sh.appendChild(el('div', 'sec', titulo));
    var r = el('div', 'row tight');
    lista.forEach(function (v) {
      var b = el('button', 'opt' + (draft[campo] === v ? ' on' : ''), v.charAt(0).toUpperCase() + v.slice(1));
      b.onclick = function () { draft[campo] = draft[campo] === v ? null : v; if (campo === 'flow' && draft.flow) draft.period = true; drawDay(); };
      r.appendChild(b);
    });
    sh.appendChild(r);
  }
  if (!draftFuture) {
    simNao('Teve menstruação?', 'period');
    opcoes('Fluxo', 'flow', ['leve', 'moderado', 'intenso']);
    opcoes('Cólica', 'cramps', ['nenhuma', 'leve', 'moderada', 'forte']);
    if (draft.cramps && draft.cramps !== 'nenhuma') {
      var tip = el('div', 'tip'); tip.appendChild(document.createTextNode('💜 Sugestões para aliviar:'));
      var ul = el('ul'); DICAS[draft.cramps].forEach(function (x) { ul.appendChild(el('li', null, x)); }); tip.appendChild(ul); sh.appendChild(tip);
    }
    sh.appendChild(el('div', 'sec', 'Humor'));
    var r = el('div', 'row tight');
    MOODS.forEach(function (m) {
      var b = el('button', 'moodb' + (draft.mood === m.key ? ' on' : ''), m.emoji);
      b.appendChild(el('small', null, m.nome)); b.setAttribute('aria-label', m.nome);
      b.onclick = function () { draft.mood = draft.mood === m.key ? null : m.key; drawDay(); };
      r.appendChild(b);
    });
    sh.appendChild(r);
    simNao('Teve relação sexual?', 'sex');
    sh.appendChild(el('div', 'sec', 'Água 💧'));
    sh.appendChild(el('p', 'help', 'A água é salva na hora, sem precisar tocar em Salvar.'));
    waterRows(sh, draftKey, function () { drawDay(); render(); });
  }
  drawReminders(sh);

  var save = el('button', 'save', draftFuture ? 'Salvar lembretes' : 'Salvar registro'); save.onclick = saveDay; sh.appendChild(save);
  if (entries[draftKey]) {
    var del = el('button', 'ghost', draftFuture ? 'Apagar lembretes deste dia' : 'Apagar registro deste dia');
    del.onclick = function () { setEntry(draftKey, null); closeAll(); toast('Apagado'); }; sh.appendChild(del);
  }
  var cancel = el('button', 'ghost', 'Cancelar'); cancel.onclick = closeAll; sh.appendChild(cancel);
  sh.scrollTop = keep;
}
function saveDay() {
  var lem = draft.reminders.map(function (r) { return { t: r.t || '', txt: (r.txt || '').trim() }; }).filter(function (r) { return r.txt; });
  var e;
  if (draftFuture) e = lem.length ? { period: false, flow: null, cramps: null, mood: null, sex: false, reminders: lem } : null;
  else {
    var vazio = !draft.period && !draft.flow && !draft.cramps && !draft.mood && !draft.sex && !lem.length;
    e = vazio ? null : { period: draft.period, flow: draft.flow, cramps: draft.cramps, mood: draft.mood, sex: draft.sex, reminders: lem };
  }
  var tinha = !!entries[draftKey];
  setEntry(draftKey, e); closeAll();
  toast(e ? (draftFuture ? 'Lembretes salvos 🔔' : 'Registro salvo 💕') : tinha ? 'Apagado' : 'Nada para salvar');
}
function setEntry(k, e) {
  if (e) entries[k] = e; else delete entries[k];
  if (cfg) pending[k] = 1;
  persist(); render(); flush();
}
function closeAll() { $('dayOv').classList.remove('open'); $('cfgOv').classList.remove('open'); }

/* ---------- sincronização (Planilha Google via Apps Script) ---------- */
function apiGet(q) { return fetch(cfg.url + '?k=' + encodeURIComponent(cfg.key) + '&' + q + '&t=' + Date.now()).then(function (r) { return r.json(); }); }
function apiPost(body) {
  body.k = cfg.key;
  return fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}
var flushing = false;
function flush() {
  if (!cfg || flushing) return Promise.resolve();
  var goalP = sendGoal();
  var keys = Object.keys(pending), wkeys = Object.keys(pendingWater);
  if (!keys.length && !wkeys.length) return goalP;
  flushing = true;
  var sentE = {}, sentW = {};
  var items = keys.map(function (k) { sentE[k] = JSON.stringify(entries[k] || null); return { date: k, entry: entries[k] || null }; });
  var wl = wkeys.map(function (k) { var q = k.split('|'); sentW[k] = pendingWater[k]; return { date: q[0], p: +q[1], ml: pendingWater[k] }; });
  return apiPost({ a: 'save', items: items, water: wl }).then(function (r) {
    if (!r.ok) throw new Error(r.error || 'erro');
    keys.forEach(function (k) { if (JSON.stringify(entries[k] || null) === sentE[k]) delete pending[k]; });
    wkeys.forEach(function (k) { if (pendingWater[k] === sentW[k]) delete pendingWater[k]; });
    syncState = 'ok'; persist();
  }).catch(function () { syncState = 'err'; }).then(function () {
    flushing = false; render();
    if (syncState === 'ok' && (Object.keys(pending).length || Object.keys(pendingWater).length)) scheduleFlush();
  });
}
function pull() {
  if (!cfg) return Promise.resolve();
  return flush().then(function () { return apiGet('a=all'); }).then(function (r) {
    if (!r.ok) throw new Error(r.error || 'erro');
    var novo = r.entries || {};
    Object.keys(pending).forEach(function (k) { if (entries[k]) novo[k] = entries[k]; else delete novo[k]; });
    entries = novo;
    var nw = r.water || {};
    Object.keys(pendingWater).forEach(function (k) { var q = k.split('|'); (nw[q[0]] = nw[q[0]] || {})[q[1]] = pendingWater[k]; });
    water = nw; store.set('water', water);
    if (r.people && r.people.length === 2) {
      people = r.people;
      if (pendingGoal != null && me != null) people[me].goal = pendingGoal;
      store.set('people', people);
    }
    if (r.vapid) { vapid = r.vapid; store.set('vapid', vapid); }
    syncState = 'ok'; persist(); render();
  }).catch(function () { syncState = 'err'; render(); });
}

/* ---------- notificações ---------- */
function b64ToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var raw = atob(s), out = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out; }
function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function checkPush() {
  if (!pushSupported()) return Promise.resolve(false);
  return navigator.serviceWorker.getRegistration().then(function (reg) { return reg ? reg.pushManager.getSubscription() : null; }).then(function (s) { pushOn = !!s; return pushOn; }).catch(function () { return false; });
}
function enablePush() {
  if (!cfg) { toast('Conecte a planilha primeiro'); return; }
  if (!pushSupported()) { toast('Instale o app na tela inicial para ativar as notificações'); return; }
  if (!vapid) { toast('Sincronizando... tente de novo em instantes'); pull(); return; }
  Notification.requestPermission().then(function (perm) {
    if (perm !== 'granted') throw new Error('Permissão negada nas configurações do celular');
    return navigator.serviceWorker.ready;
  }).then(function (reg) {
    return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(vapid) });
  }).then(function (sub) {
    var nome = /iphone|ipad/i.test(navigator.userAgent) ? 'iPhone' : /android/i.test(navigator.userAgent) ? 'Android' : 'Computador';
    return apiPost({ a: 'sub', sub: sub.toJSON(), device: nome, site: location.origin + location.pathname });
  }).then(function (r) {
    if (!r.ok) throw new Error(r.error || 'erro');
    pushOn = true; toast('Notificações ativadas 🔔'); openCfg();
  }).catch(function (e) { toast('Não deu: ' + e.message); });
}
function testPush() { apiPost({ a: 'test' }).then(function (r) { toast(r.ok ? 'Teste enviado para ' + C.plural(r.sent, 'aparelho', 'aparelhos') : 'Erro: ' + r.error); }).catch(function () { toast('Sem conexão'); }); }

/* ---------- configurações ---------- */
function codigo() { return 'PC1.' + btoa(unescape(encodeURIComponent(JSON.stringify({ u: cfg.url, k: cfg.key })))); }
function openCfg() {
  var sh = $('cfgSheet'); sh.textContent = '';
  sh.appendChild(el('div', 'handle'));
  sh.appendChild(el('div', 's-title', 'Configurações'));
  sh.appendChild(el('div', 's-sub', 'Sincronização, notificações e previsão do tempo'));

  sh.appendChild(el('div', 'sec', '☁️ Sincronização do casal'));
  if (cfg) {
    sh.appendChild(el('span', 'pill ok', 'Conectado à planilha'));
    sh.appendChild(el('p', 'help', 'Para conectar o outro celular, copie o código e cole nesta mesma tela no app dele(a).'));
    var cp = el('button', 'btn2', 'Copiar código de conexão');
    cp.onclick = function () { var c = codigo(); (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function () { toast('Código copiado'); }).catch(function () { window.prompt('Copie o código:', c); }); };
    sh.appendChild(cp);
    var sy = el('button', 'btn2', 'Sincronizar agora'); sy.onclick = function () { pull().then(function () { toast(syncState === 'ok' ? 'Sincronizado' : 'Sem conexão'); }); }; sh.appendChild(sy);
    var off = el('button', 'ghost', 'Desconectar este celular');
    off.onclick = function () { if (confirm('Desconectar? Os registros continuam na planilha.')) { cfg = null; pending = {}; pendingWater = {}; pendingGoal = null; store.set('pendingGoal', null); store.set('cfg', null); persist(); render(); openCfg(); } };
    sh.appendChild(off);
  } else {
    sh.appendChild(el('span', 'pill', 'Dados só neste celular'));
    sh.appendChild(el('p', 'help', 'Cole o código de conexão recebido do outro celular, ou o link do Apps Script e a senha.'));
    var i1 = el('input'); i1.type = 'text'; i1.placeholder = 'Código (PC1...) ou link do Apps Script'; i1.autocapitalize = 'off'; i1.style.marginTop = '8px'; sh.appendChild(i1);
    var i2 = el('input'); i2.type = 'password'; i2.placeholder = 'Senha (se usou o link)'; i2.style.marginTop = '8px'; sh.appendChild(i2);
    var go = el('button', 'btn2', 'Conectar');
    go.onclick = function () {
      var v = i1.value.trim(), novo;
      try {
        if (v.indexOf('PC1.') === 0) { var o = JSON.parse(decodeURIComponent(escape(atob(v.slice(4))))); novo = { url: o.u, key: o.k }; }
        else novo = { url: v, key: i2.value.trim() };
        if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(novo.url) || !novo.key) throw 0;
      } catch (e) { toast('Código ou link inválido'); return; }
      var locais = entries; cfg = novo; go.disabled = true; go.textContent = 'Conectando...';
      apiGet('a=all').then(function (r) {
        if (!r.ok) throw new Error(r.error);
        store.set('cfg', cfg);
        Object.keys(locais).forEach(function (k) { if (!(r.entries || {})[k]) pending[k] = 1; });   // envia o que já existia aqui
        Object.keys(water).forEach(function (d) { [0, 1].forEach(function (q) { if (water[d][q] && !((r.water || {})[d] || {})[q]) pendingWater[d + '|' + q] = water[d][q]; }); });
        return pull();
      }).then(function () { toast('Conectado 💕'); openCfg(); })
        .catch(function (e) { cfg = null; go.disabled = false; go.textContent = 'Conectar'; toast(e && e.message === 'senha' ? 'Senha incorreta' : 'Não foi possível conectar'); });
    };
    sh.appendChild(go);
  }

  sh.appendChild(el('div', 'sec', '👤 Quem usa este celular'));
  choosePerson(sh);
  if (me != null) { var gb = el('button', 'btn2', 'Minha meta de água: ' + fmtMl(people[me].goal)); gb.onclick = openGoal; sh.appendChild(gb); }

  sh.appendChild(el('div', 'sec', '🔔 Notificações'));
  sh.appendChild(el('p', 'help', '7h: previsão do tempo (máxima, mínima e chance de chuva). 20h: dias para a menstruação e para o período fértil. Lembretes: no horário marcado.'));
  var st = el('span', 'pill' + (pushOn ? ' ok' : ''), pushOn ? 'Ativadas neste celular' : 'Desativadas neste celular'); st.style.marginTop = '8px'; sh.appendChild(st);
  if (!pushOn) { var on = el('button', 'btn2', 'Ativar notificações neste celular'); on.onclick = enablePush; sh.appendChild(on); }
  else { var te = el('button', 'btn2', 'Enviar notificação de teste'); te.onclick = testPush; sh.appendChild(te); }
  if (!pushSupported()) sh.appendChild(el('p', 'help', 'Neste navegador as notificações não estão disponíveis. No iPhone, instale o app pela opção "Adicionar à Tela de Início" (iOS 16.4 ou mais novo) e abra por lá.'));

  sh.appendChild(el('div', 'sec', '☀️ Previsão do tempo'));
  sh.appendChild(el('span', 'pill', 'Local: ' + loc.name));
  var gl = el('button', 'btn2', 'Usar a localização deste celular');
  gl.onclick = function () {
    if (!navigator.geolocation) { toast('Localização indisponível'); return; }
    navigator.geolocation.getCurrentPosition(function (p) { loc = { lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3), name: 'Sua região' }; store.set('loc', loc); mirror(); loadWeather(); openCfg(); toast('Local atualizado'); }, function () { toast('Não foi possível obter a localização'); });
  };
  sh.appendChild(gl);
  if (loc.name !== 'Curitiba') { var cw = el('button', 'ghost', 'Voltar para Curitiba'); cw.onclick = function () { loc = { lat: -25.43, lon: -49.27, name: 'Curitiba' }; store.set('loc', loc); mirror(); loadWeather(); openCfg(); }; sh.appendChild(cw); }

  var close = el('button', 'save', 'Fechar'); close.onclick = closeAll; sh.appendChild(close);
  $('cfgOv').classList.add('open');
}

function loadWeather() {
  var c = store.get('wx', null), hoje = C.key(C.today());
  if (c && c.day === hoje && c.lat === loc.lat) { weather = c.w; render(); }
  C.fetchWeather(loc.lat, loc.lon).then(function (w) { if (w) { weather = w; store.set('wx', { day: hoje, lat: loc.lat, w: w }); render(); } else if (!weather) $('c3u').textContent = 'indisponível'; })
    .catch(function () { if (!weather) $('c3u').textContent = 'sem conexão'; });
}

/* ---------- eventos ---------- */
$('prev').onclick = function () { view.m--; if (view.m < 0) { view.m = 11; view.y--; } render(); };
$('next').onclick = function () { view.m++; if (view.m > 11) { view.m = 0; view.y++; } render(); };
$('fab').onclick = function () { openDay(C.key(C.today())); };
$('gear').onclick = function () { checkPush().then(openCfg); };
$('banner').onclick = function () { store.set('hideInstall', true); render(); };
['dayOv', 'cfgOv'].forEach(function (id) { $(id).addEventListener('click', function (e) { if (e.target === $(id)) closeAll(); }); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(); pull(); loadWeather(); } });
window.addEventListener('online', function () { pull(); });
setInterval(render, 60000);     // troca a frase quando muda o turno
setInterval(function () { if (!document.hidden) pull(); }, 90000);   // traz a água do outro celular

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
render(); mirror(); loadWeather(); pull(); checkPush();
})();
</script>
